services:
  mysql:
    image: mysql:8.4
    container_name: innova-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: innova_db
      MYSQL_USER: innova
      MYSQL_PASSWORD: innova
    volumes:
      - innova_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  innova_mysql_data:
